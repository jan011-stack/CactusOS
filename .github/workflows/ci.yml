name: CactusOS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax / import check
        run: |
          python3 -m compileall -q hyperos

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (no_std lib)
        run: cargo test --lib
      - name: Cargo check (no_std lib)
        run: cargo check --lib
      - name: Install bare-metal target
        run: rustup target add x86_64-unknown-none
      - name: Cargo check (bare-metal kernel)
        run: cargo check --release --target x86_64-unknown-none --features baremetal --bin hyperos-kernel
      - name: Install QEMU smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 grub-common grub-pc-bin xorriso mtools
      - name: Boot kernel in QEMU
        run: bash vm/cactus-kernel-qemu.sh
